name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Blueprint modules (or module:Class targets) to audit, space-separated.
  AUDIT_TARGETS: examples/fleet.py
  # Add --strict to fail on warnings as well as errors.
  AUDIT_ARGS: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: bpkit audit
        shell: bash
        run: |
          set -o pipefail
          {
            echo '### bpkit audit'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          status=0
          bpkit audit $AUDIT_TARGETS $AUDIT_ARGS | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: JSON report
        if: always()
        run: bpkit audit $AUDIT_TARGETS $AUDIT_ARGS --json > audit.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bpkit-audit
          path: audit.json
