name: Docs

# Build the pdoc site (guide + API reference) and publish it to GitHub Pages.
# Pull requests build the site and check the guide's examples, but only main deploys.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Check the guide's examples still run
        run: pytest -q tests/test_docs.py

      - name: Build site
        run: >
          pdoc bpkit
          --output-directory site
          --edit-url bpkit=https://github.com/${{ github.repository }}/blob/${{ github.sha }}/src/bpkit/
          --footer-text "bpkit ${{ github.sha }}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
